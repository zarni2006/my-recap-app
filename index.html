<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burma Voice - AI Video Recap & Voice Studio</title>
    <style>
        body { font-family: sans-serif; background: #ffffff; color: #000000; margin: 0; padding: 15px; }
        h2, h3 { font-size: 16px; margin-bottom: 8px; color: #000000; }
        .card { background: #f9f9f9; padding: 15px; border-radius: 12px; border: 1px solid #000000; margin-bottom: 12px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; background: #ffffff; border: 1px solid #000000; color: #000000; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { background: #000000; color: #ffffff; font-weight: bold; cursor: pointer; }
        button:hover { background: #333333; }
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #000000; }
        .nav-item { font-size: 11px; color: #666666; text-align: center; text-decoration: none; cursor: pointer; }
        .nav-item.active { color: #000000; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎙️ Burma Voice & AI Video Recap Studio</h2>
        <p style="font-size: 12px; color: #333333;">မူပိုင်ခွင့် (Copyright) ကင်းဝေးစေရန် ကိုယ်ပိုင် AI အသံနှင့် ဇာတ်ကြောင်းပြော ဖန်တီးပါ။</p>
        
        <!-- Password Section -->
        <div style="background: #eeeeee; padding: 10px; border-radius: 8px; border: 1px solid #000000; margin-bottom: 10px;">
            <label style="font-size: 11px; color: #000000; font-weight: bold;">🔒 စကားဝှက် (zar200614) သို့မဟုတ် One-Time Token:</label>
            <input type="password" id="adminPassword" placeholder="စကားဝှက် ထည့်ပါ..." oninput="checkAccess()">
            <p id="accessStatus" style="font-size: 11px; color: #666; margin: 2px 0 0 0;">ℹ️ Standard Mode (တစ်နေ့ ဗီဒီယို ၃ ထုတ်ခွင့်)</p>
        </div>

        <label style="font-size: 12px; font-weight: bold;">ဗီဒီယို လင့်ခ် (သို့မဟုတ်) စာသား ထည့်ပါ:</label>
        <input type="text" id="videoUrl" placeholder="TikTok / YouTube Link...">

        <label style="font-size: 12px; font-weight: bold;">🎭 အသံအမျိုးအစား ရွေးချယ်ရန်:</label>
        <select id="voiceSelect">
            <option value="Nandar">Nandar - News (သတင်း / ပင်မအသံ - မပါမဖြစ်)</option>
            <option value="Kyaw">Kyaw - Sports Live (အားကစား / အက်ရှင်)</option>
            <option value="Zaw">Zaw - Sports (ကြမ်းတမ်းသော အသံ)</option>
            <option value="Nay">Nay - Match Recap (ရုပ်ရှင်ဇာတ်လမ်းပြော)</option>
            <option value="Thant">Thant - Audiobook</option>
            <option value="Wai">Wai - Female (သဘာဝဆန်သော အမျိုးသမီးအသံ)</option>
            <option value="Pyae">Pyae - Male (အမျိုးသား အသံသန့်)</option>
            <option value="Phyo">Phyo - Game Coach</option>
            <option value="May">May - Flash Promo</option>
            <option value="Mya">Mya - Cooking</option>
            <option value="Min">Min - Education</option>
            <option value="Thiri">Thiri - Meditation</option>
            <option value="Hein">Hein - Kids</option>
        </select>

        <button onclick="processRecap()">🚀 စာသားနှင့် အသံ ထုတ်ယူမည်</button>
        <p id="resultMsg" style="margin-top: 10px; font-size: 12px; font-weight: bold;"></p>
    </div>

    <div style="height: 60px;"></div>

    <div class="nav">
        <a class="nav-item active">🏠<br>ပင်မစာမျက်နှာ</a>
        <a class="nav-item">🎙️<br>အသံ Studio</a>
        <a class="nav-item">💳<br>ပလပ်များ</a>
        <a class="nav-item">👤<br>ပရိုဖိုင်</a>
    </div>

<script>
    const OWNER_PASSWORD = "zar200614";

    function checkAccess() {
        const pass = document.getElementById('adminPassword').value.trim();
        const status = document.getElementById('accessStatus');
        
        if (pass === OWNER_PASSWORD) {
            status.style.color = "#000000";
            status.style.fontWeight = "bold";
            status.innerText = "✅ Owner Mode (အကန့်အသတ်မရှိ အလွတ်သုံးနိုင်သည်)";
        } else if (pass.startsWith("TOKEN-")) {
            status.style.color = "#000000";
            status.innerText = "✅ One-Time Token ဖြင့် ဝင်ရောက်ထားသည်";
        } else {
            status.style.color = "#666666";
            status.innerText = "ℹ️ Standard Mode (တစ်နေ့ ဗီဒီယို ၃ ထုတ်ခွင့်)";
        }
    }

    function processRecap() {
        const pass = document.getElementById('adminPassword').value.trim();
        const url = document.getElementById('videoUrl').value;
        const voice = document.getElementById('voiceSelect').value;
        const msg = document.getElementById('resultMsg');

        if (!url) {
            alert("ကျေးဇူးပြု၍ ဗီဒီယို လင့်ခ် (သို့မဟုတ်) စာသား ထည့်ပါ။");
            return;
        }

        // Owner စကားဝှက် zar200614 ဖြင့် ကန့်သတ်ချက်မရှိ အလွတ်သုံးခွင့်
        if (pass === OWNER_PASSWORD) {
            msg.style.color = "#000000";
            msg.innerText = "✅ အောင်မြင်ပါသည်။ (Owner အဖြစ် အကန့်အသတ်မရှိ ထုတ်ယူပြီးပါပြီ - Voice: " + voice + ")";
            return;
        }

        // တစ်ခါသုံးသော့ (One-Time Token) ဖြင့် ဝင်ရောက်ခြင်း
        if (pass.startsWith("TOKEN-")) {
            msg.style.color = "#000000";
            msg.innerText = "✅ One-Time Token ဖြင့် အောင်မြင်စွာ ထုတ်ယူပြီးပါပြီ။ (Voice: " + voice + ")";
            return;
        }

        // သာမန်သုံးစွဲသူများအတွက် တစ်နေ့ ဗီဒီယို ၃ ကြိမ် ကန့်သတ်ချက်
        const today = new Date().toISOString().slice(0, 10);
        let usage = JSON.parse(localStorage.getItem('user_usage') || '{}');

        if (usage.date !== today) {
            usage = { date: today, count: 0 };
        }

        if (usage.count >= 3) {
            msg.style.color = "#ff0000";
            msg.innerText = "❌ ဒီနေ့အတွက် အခမဲ့ ခွဲတမ်း (ဗီဒီယို ၃ ကြိမ်) ပြည့်သွားပါပြီ။ One-Time Token သို့မဟုတ် Owner စကားဝှက် (zar200614) ထည့်ပါ။";
            return;
        }

        usage.count += 1;
        localStorage.setItem('user_usage', JSON.stringify(usage));
        msg.style.color = "#000000";
        msg.innerText = "✅ အောင်မြင်ပါသည်။ (ဒီနေ့အတွက် သုံးစွဲမှု: " + usage.count + "/3 - Voice: " + voice + ")";
    }
</script>

</body>
            </html>
